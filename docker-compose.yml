services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: titan
      POSTGRES_USER: titan
      POSTGRES_PASSWORD: titan
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titan -d titan"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  temporal-postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: titan
      POSTGRES_PASSWORD: titan
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titan -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - temporal_postgres_data:/var/lib/postgresql

  temporal:
    image: temporalio/auto-setup:latest
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: titan
      POSTGRES_PWD: titan
      POSTGRES_SEEDS: temporal-postgres
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    ports:
      - "7233:7233"
    depends_on:
      temporal-postgres:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: titan
      MINIO_ROOT_PASSWORD: titan-local-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  temporal_postgres_data:
  minio_data:
